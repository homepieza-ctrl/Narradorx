name: Compilar APK
"on":
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses || true
      - name: Instalar SDK Android requerido
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Instalar Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
